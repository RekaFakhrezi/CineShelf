<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0D1724" />
    <meta name="description" content="Katalog film dan serial pribadi. Susun watchlist, rak tematik, dan catat tontonanmu." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <title>%WEB_TITLE%</title>
    <style id="expo-reset">
      html, body {
        height: 100%;
      }
      body {
        margin: 0;
        overflow: hidden;
        overscroll-behavior-y: none;
        background: #0D1724;
      }
      #root {
        display: flex;
        width: 100%;
        height: 100%;
        /* Follow mobile browser chrome; only React Native ScrollViews scroll. */
        height: 100dvh;
        overflow: hidden;
        flex: 1;
      }
    </style>
  </head>
